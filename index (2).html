<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ميلاد غدير الأغلى 🤍</title>
    
    <!-- Meta tags for high-performance mobile PWA support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="غدير 🤍" />

    <!-- Google Fonts: Cairo & Playfair Display & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              oliveDeep: '#0f1715',
              oliveDark: '#1b2622',
              oliveMedium: '#2a3b35',
              oliveLight: '#445c53',
              goldGlow: '#e2b474',
            },
            fontFamily: {
              cairo: ['Cairo', 'sans-serif'],
              playfair: ['Playfair Display', 'serif'],
              mono: ['JetBrains Mono', 'monospace'],
            }
          }
        }
      }
    </script>

    <!-- Custom High-Fidelity App Styling -->
    <style>
      body {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Cairo', sans-serif;
        background-color: #0d1412;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }

      /* Floating Ambient Glow Background Layer */
      @keyframes float-slow {
        0%, 100% {
          transform: translateY(0px) translateX(0px) scale(1);
        }
        50% {
          transform: translateY(-20px) translateX(15px) scale(1.08);
        }
      }

      .animate-float-slow {
        animation: float-slow 8s infinite ease-in-out;
      }

      @keyframes float-reverse {
        0%, 100% {
          transform: translateY(0px) translateX(0px) scale(1);
        }
        50% {
          transform: translateY(15px) translateX(-20px) scale(0.92);
        }
      }

      .animate-float-reverse {
        animation: float-reverse 10s infinite ease-in-out;
      }

      /* iOS Glassmorphism styling */
      .glass-panel {
        background: rgba(27, 38, 34, 0.55);
        backdrop-filter: blur(20px) saturate(140%);
        -webkit-backdrop-filter: blur(20px) saturate(140%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
      }

      .glass-button {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .glass-button:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.3);
        transform: translateY(-1px);
      }

      .glass-button:active:not(:disabled) {
        background: rgba(255, 255, 255, 0.05);
        transform: translateY(1px) scale(0.97);
      }

      /* Pop-in smooth bounce animation */
      @keyframes pop-in {
        0% {
          opacity: 0;
          transform: scale(0.92);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      .animate-pop-in {
        animation: pop-in 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Particle dynamic physics animation */
      @keyframes particle-fade-out {
        0% {
          transform: translate(-50%, -50%) translate(0px, 0px) scale(0.4) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translate(-50%, -50%) translate(var(--dx), var(--dy)) scale(var(--scale)) rotate(var(--rot));
          opacity: 0;
        }
      }

      .animate-heart-particle {
        animation: particle-fade-out var(--dur) cubic-bezier(0.1, 0.8, 0.25, 1) forwards;
      }

      /* Typewriter active cursor styling */
      @keyframes cursor-blink {
        50% { opacity: 0; }
      }

      .typewriter-cursor::after {
        content: '|';
        animation: cursor-blink 0.8s infinite step-start;
        color: #e2b474;
      }

      /* Hide default scrollbars */
      .custom-scroll::-webkit-scrollbar {
        width: 3px;
      }
      .custom-scroll::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scroll::-webkit-scrollbar-thumb {
        background: rgba(226, 180, 116, 0.2);
        border-radius: 10px;
      }
    </style>
  </head>
  <body class="bg-[#0d1412] text-white flex flex-col items-center justify-center min-h-screen w-full overflow-hidden px-4 relative">
    
    <!-- Dynamic Heart Particle Layers -->
    <div id="global-particles-container" class="absolute inset-0 pointer-events-none overflow-hidden z-25"></div>

    <!-- Glowing Vector Art Backdrops -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
      <div class="absolute -top-12 -left-12 w-80 h-80 bg-[#1b2622] rounded-full blur-[80px] opacity-40 animate-float-slow"></div>
      <div class="absolute -bottom-20 -right-20 w-96 h-96 bg-[#2a3b35] rounded-full blur-[90px] opacity-35 animate-float-reverse"></div>
      <div class="absolute top-1/3 left-1/2 -translate-x-1/2 w-72 h-72 bg-[#101917] rounded-full blur-[100px] opacity-50"></div>
      
      <!-- Golden Ambient sparks -->
      <div class="absolute top-12 left-1/4 w-1 h-1 bg-[#e2b474] rounded-full opacity-60 animate-pulse"></div>
      <div class="absolute top-1/3 right-1/4 w-1.5 h-1.5 bg-[#e2b474] rounded-full opacity-40 animate-pulse" style="animation-delay: 1s;"></div>
      <div class="absolute bottom-12 left-1/3 w-1.5 h-1.5 bg-white rounded-full opacity-30 animate-pulse" style="animation-delay: 2.5s;"></div>
      <div class="absolute bottom-1/4 right-12 w-1 h-1 bg-[#e2b474] rounded-full opacity-50 animate-pulse" style="animation-delay: 1.8s;"></div>
    </div>

    <!-- PWA Installation Badge -->
    <button id="pwa-badge" class="hidden absolute top-4 sm:top-6 z-30 flex items-center gap-2 bg-[#1b2622]/80 backdrop-blur-md px-4 py-2 rounded-full border border-white/10 text-xs text-[#e2b474] font-medium active:scale-95 shadow-md hover:bg-[#2a3b35]/80 transition-all cursor-pointer">
      <svg class="w-3.5 h-3.5 animate-bounce" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
        <line x1="12" y1="18" x2="12.01" y2="18"></line>
      </svg>
      <span>تثبيت التطبيق على الشاشة الرئيسية 📱</span>
    </button>

    <!-- PERFECTLY SQUARE CARD CONTAINER (260x260px) centered exactly -->
    <div id="birthday-gift-card" class="relative z-10 w-[260px] h-[260px] rounded-3xl p-4 flex flex-col justify-between items-center text-center glass-panel select-none overflow-hidden animate-pop-in">
      
      <!-- Inner step elements container -->
      <div id="step-content" class="flex flex-col justify-between items-center w-full h-full py-1">
        <!-- Label Area -->
        <span id="step-label" class="text-xs font-mono text-[#e2b474]/70 uppercase tracking-widest">
          Mylady 👑
        </span>
        
        <!-- Text Area with Dynamic content -->
        <div class="flex-1 flex flex-col justify-center items-center px-1 overflow-y-auto custom-scroll w-full py-2">
          <h2 id="step-headline" class="text-[18px] sm:text-[19px] font-bold text-white font-cairo leading-snug tracking-tight typewriter-cursor">
            <!-- Dynamic Typing Text -->
          </h2>
          <div id="step-poetry" class="hidden w-full">
            <p id="poetry-text" class="text-[11px] font-medium text-white/90 font-cairo leading-normal text-center whitespace-pre-line tracking-tight px-0.5">
              <!-- Animated poetry -->
            </p>
          </div>
        </div>
        
        <!-- Action Control Button -->
        <button id="action-button" disabled class="w-full py-2 rounded-xl text-sm font-semibold font-cairo shadow-inner glass-button text-white flex items-center justify-center gap-1.5 cursor-pointer transform active:scale-95 transition-all opacity-40 pointer-events-none">
          <span id="button-text">زينة</span>
          <svg class="w-3.5 h-3.5 text-[#e2b474] fill-[#e2b474]" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
        </button>
      </div>

    </div>

    <!-- Humid copyright footer -->
    <footer class="absolute bottom-6 z-10 text-[10px] font-mono text-white/30 tracking-tight text-center pointer-events-none">
      <span>Ghadir’s Day 🤍 Crafted For Ghadir</span>
    </footer>

    <!-- Vanilla Javascript Logic Core -->
    <script>
      const textConfig = {
        1: "شلونج ملاكي؟",
        2: "اليوم تاريخ ميلاد منو؟",
        3: "غدير تعرفين مفروض انطيج غزل على هل جمال؟",
        4: "يَا مَنْ مَلَكْتِ الرُّوحَ وَالقَلْبُ بَيْتُكِ\nأَنْتِ الهَوَى المَكْتُوبُ وَأَنْتِ حَلَالِي\nنَسِيرُ فِي دَرْبِ الحَيَاةِ بِعِشْقِنَا\nوَحُبُّكِ الصَّافِي يُنِيرُ اليَالِي\nوَإِنْ بَغَيْتِ العُمْرَ كُلَّ العُمْرِ لَكِ\nيَا جَنَّةَ الدُّنْيَا وَأَغْلَى غَالِي"
      };

      const buttonTextConfig = {
        1: "زينة",
        2: "ميلادي 🎂",
        3: "كولي 🤍",
        4: "اني هم احبك🎀"
      };

      const stepLabels = {
        1: "Mylady 👑",
        2: "Specials ✨",
        3: "Admiration 🤍",
        4: "شعر لغدير 🌸",
        5: "أغنيتنا المفضلة 🎵"
      };

      let currentStep = 1;
      let typingInterval = null;

      // DOM Elements Query
      const stepLabel = document.getElementById('step-label');
      const stepHeadline = document.getElementById('step-headline');
      const stepPoetry = document.getElementById('step-poetry');
      const poetryText = document.getElementById('poetry-text');
      const actionButton = document.getElementById('action-button');
      const buttonText = document.getElementById('button-text');
      const stepContent = document.getElementById('step-content');
      const globalParticlesContainer = document.getElementById('global-particles-container');

      // Initialize Typing animations
      function runTypewriter(step) {
        // Clear previous interval if any
        if (typingInterval) {
          clearInterval(typingInterval);
        }

        // Disable button while typing
        actionButton.disabled = true;
        actionButton.classList.add('opacity-40', 'pointer-events-none');

        const message = textConfig[step] || '';
        let index = 0;
        const speed = step === 4 ? 25 : 60;

        if (step === 4) {
          stepHeadline.classList.add('hidden');
          stepPoetry.classList.remove('hidden');
          poetryText.textContent = '';
          
          typingInterval = setInterval(() => {
            if (index < message.length) {
              poetryText.textContent = message.substring(0, index + 1);
              index++;
            } else {
              clearInterval(typingInterval);
              actionButton.disabled = false;
              actionButton.classList.remove('opacity-40', 'pointer-events-none');
            }
          }, speed);
        } else {
          stepHeadline.classList.remove('hidden');
          stepPoetry.classList.add('hidden');
          stepHeadline.textContent = '';
          stepHeadline.classList.add('typewriter-cursor');

          typingInterval = setInterval(() => {
            if (index < message.length) {
              stepHeadline.textContent = message.substring(0, index + 1);
              index++;
            } else {
              clearInterval(typingInterval);
              stepHeadline.classList.remove('typewriter-cursor');
              actionButton.disabled = false;
              actionButton.classList.remove('opacity-40', 'pointer-events-none');
            }
          }, speed);
        }
      }

      // Sparkly vector hearts burst
      function triggerParticles(e) {
        const container = globalParticlesContainer;
        if (!container) return;

        let clickX = window.innerWidth / 2;
        let clickY = window.innerHeight / 2 + 80;

        if (e && e.clientX && e.clientY) {
          clickX = e.clientX;
          clickY = e.clientY;
        }

        const colors = ['#e2b474', '#ffffff', '#ff94b4', '#ffceda'];
        for (let i = 0; i < 20; i++) {
          const particle = document.createElement('span');
          particle.textContent = '❤';
          particle.className = 'absolute text-rose-500 pointer-events-none font-bold text-lg select-none animate-heart-particle';
          particle.style.left = `${clickX}px`;
          particle.style.top = `${clickY}px`;

          const angle = Math.random() * Math.PI * 2;
          const velocity = Math.random() * 85 + 40; 
          const dx = `${Math.cos(angle) * velocity}px`;
          const dy = `${Math.sin(angle) * velocity - 30}px`; 
          const rotation = `${Math.random() * 240 - 120}deg`;
          const scale = Math.random() * 0.8 + 0.5;
          const dur = `${Math.random() * 0.4 + 0.8}s`;

          particle.style.setProperty('--dx', dx);
          particle.style.setProperty('--dy', dy);
          particle.style.setProperty('--rot', rotation);
          particle.style.setProperty('--scale', scale);
          particle.style.setProperty('--dur', dur);
          particle.style.textShadow = '0 0 8px rgba(244,63,94,0.4)';

          container.appendChild(particle);

          // DOM Cleanup
          setTimeout(() => {
            particle.remove();
          }, 1500);
        }
      }

      // Play sound context spark
      function playInteractionBeep() {
        try {
          const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
          if (AudioCtxClass) {
            const audioCtx = new AudioCtxClass();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.15); // C6 spark
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
          }
        } catch (_) {}
      }

      // Transition handling to next step
      actionButton.addEventListener('click', (e) => {
        triggerParticles(e);
        playInteractionBeep();

        // Fade out transition
        stepContent.style.transition = 'opacity 0.2s ease-out, transform 0.2s ease-out';
        stepContent.style.opacity = '0';
        stepContent.style.transform = 'scale(0.95)';

        setTimeout(() => {
          currentStep++;
          if (currentStep <= 4) {
            // Update textual elements
            stepLabel.textContent = stepLabels[currentStep];
            buttonText.textContent = buttonTextConfig[currentStep];
            
            // Fade in transition & start typewriter
            stepContent.style.opacity = '1';
            stepContent.style.transform = 'scale(1)';
            runTypewriter(currentStep);
          } else {
            // Render Step 5 Youtube Player Layout
            renderStepFive();
            stepContent.style.opacity = '1';
            stepContent.style.transform = 'scale(1)';
          }
        }, 220);
      });

      // Render Final Step Premium Player Layout
      function renderStepFive() {
        stepContent.innerHTML = `
          <span class="text-[10px] font-mono text-[#e2b474]/90 uppercase tracking-widest font-semibold">${stepLabels[5]}</span>
          
          <!-- YouTube embedded interactive landscape frame -->
          <div class="w-full h-[110px] rounded-2xl overflow-hidden border border-[#e2b474]/25 shadow-md bg-black/40 my-1">
            <iframe
              class="w-full h-full block"
              src="https://www.youtube.com/embed/3YxaaGgTQYM?autoplay=1&mute=0&controls=1&rel=0&playsinline=1&enablejsapi=1"
              allow="autoplay; encrypted-media"
              title="Favorite Song"
              id="youtube-player"
            ></iframe>
          </div>

          <!-- Title & Artist -->
          <div class="text-center my-0.5 max-w-[210px] truncate">
            <h5 class="text-[11px] font-bold text-white font-cairo truncate">وين ذكرياتنا (يا غائباً)</h5>
            <p class="text-[9px] text-[#e2b474]/75 font-cairo font-medium truncate">عبدالله آل مخلص 🤍</p>
          </div>

          <!-- YouTube redirection button -->
          <a
            href="https://youtu.be/3YxaaGgTQYM?si=LIYIsqHo6nRV6ZSR"
            target="_blank"
            rel="noopener noreferrer"
            id="youtube-redirect-btn"
            class="w-full py-1.5 rounded-xl text-[10px] font-semibold font-cairo bg-gradient-to-r from-[#e2b474] to-[#cba063] hover:from-[#f3ca8f] hover:to-[#dfb578] text-black flex items-center justify-center gap-1 cursor-pointer shadow-lg active:scale-95 transition-all text-center select-none decoration-none no-underline"
          >
            <span>افتح في يوتيوب 🤍</span>
            <svg class="w-3 h-3 text-black" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
            </svg>
          </a>
        `;

        // Listen redirection particle burst
        document.getElementById('youtube-redirect-btn').addEventListener('click', (e) => {
          triggerParticles(e);
          playInteractionBeep();
        });
      }

      // Hook PWA banner controls
      let deferredPrompt;
      const pwaBadge = document.getElementById('pwa-badge');

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        pwaBadge.classList.remove('hidden');
      });

      pwaBadge.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            pwaBadge.classList.add('hidden');
          }
          deferredPrompt = null;
        }
      });

      // Kickoff First Step typewriter
      runTypewriter(currentStep);
    </script>
  </body>
</html>
