<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ميلاد غدير الأغلى 🤍</title>
    
    <!-- PWA Headers -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1b2622" />
    
    <!-- iOS meta tags for native PWA behavior -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="غدير 🤍" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    
    <!-- Google Fonts (Cairo & Playfair Display) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">

    <!-- Lucide Icons via CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              cairo: ['Cairo', 'sans-serif'],
              playfair: ['Playfair Display', 'serif'],
            },
            colors: {
              olive: {
                deep: '#0f1715',
                dark: '#1b2622',
                medium: '#2a3b35',
                light: '#445c53',
              },
              gold: {
                glow: '#e2b474',
              }
            }
          }
        }
      }
    </script>

    <!-- Custom CSS animations and Glassmorphic effects -->
    <style>
      @keyframes heart-pulse {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3)) drop-shadow(0 0 5px rgba(226, 180, 116, 0.2));
        }
        50% {
          transform: scale(1.18);
          filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.7)) drop-shadow(0 0 15px rgba(226, 180, 116, 0.4));
        }
      }

      @keyframes float-slow {
        0%, 100% { transform: translateY(0px) translateX(0px) scale(1); }
        50% { transform: translateY(-20px) translateX(15px) scale(1.08); }
      }

      @keyframes float-reverse {
        0%, 100% { transform: translateY(0px) translateX(0px) scale(1); }
        50% { transform: translateY(15px) translateX(-20px) scale(0.92); }
      }

      @keyframes pop-in {
        0% { opacity: 0; transform: scale(0.92); }
        100% { opacity: 1; transform: scale(1); }
      }

      @keyframes particle-fade-out {
        0% {
          transform: translate(-50%, -50%) translate(0px, 0px) scale(0.4) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translate(-50%, -50%) translate(var(--dx), var(--dy)) scale(var(--scale)) rotate(var(--rot));
          opacity: 0;
        }
      }

      @keyframes cursor-blink {
        50% { opacity: 0; }
      }

      .animate-pulse-heart {
        animation: heart-pulse 1.3s infinite ease-in-out;
      }
      .animate-float-slow {
        animation: float-slow 8s infinite ease-in-out;
      }
      .animate-float-reverse {
        animation: float-reverse 10s infinite ease-in-out;
      }
      .animate-pop-in {
        animation: pop-in 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .animate-heart-particle {
        animation: particle-fade-out var(--dur) cubic-bezier(0.1, 0.8, 0.25, 1) forwards;
      }
      .typewriter-cursor::after {
        content: '|';
        animation: cursor-blink 0.8s infinite step-start;
        color: #e2b474;
      }
      .glass-panel {
        background: rgba(27, 38, 34, 0.55);
        backdrop-filter: blur(20px) saturate(140%);
        -webkit-backdrop-filter: blur(20px) saturate(140%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
      }
      .glass-button {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .glass-button:not([disabled]):hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.3);
        transform: translateY(-1px);
      }
      .glass-button:not([disabled]):active {
        background: rgba(255, 255, 255, 0.05);
        transform: translateY(1px) scale(0.97);
      }
    </style>
  </head>
  <body class="bg-[#0d1412] text-white flex flex-col items-center justify-center min-h-screen w-full font-sans overflow-hidden px-4 select-none">
    
    <!-- Decorative Interactive Background Layers -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
      <div class="absolute -top-12 -left-12 w-80 h-80 bg-[#1b2622] rounded-full blur-[80px] opacity-40 animate-float-slow"></div>
      <div class="absolute -bottom-20 -right-20 w-96 h-96 bg-[#2a3b35] rounded-full blur-[90px] opacity-35 animate-float-reverse"></div>
      <div class="absolute top-1/3 left-1/2 -translate-x-1/2 w-72 h-72 bg-[#101917] rounded-full blur-[100px] opacity-50"></div>
      
      <!-- Tiny golden sparks -->
      <div class="absolute top-12 left-1/4 w-1 h-1 bg-[#e2b474] rounded-full opacity-60 animate-pulse"></div>
      <div class="absolute top-1/3 right-1/4 w-1.5 h-1.5 bg-[#e2b474] rounded-full opacity-40 animate-pulse" style="animation-delay: 1s;"></div>
      <div class="absolute bottom-12 left-1/3 w-1.5 h-1.5 bg-white rounded-full opacity-30 animate-pulse" style="animation-delay: 2.5s;"></div>
      <div class="absolute bottom-1/4 right-12 w-1 h-1 bg-[#e2b474] rounded-full opacity-50 animate-pulse" style="animation-delay: 1.8s;"></div>
    </div>

    <!-- PWA Install Banner -->
    <button
      id="pwa-banner"
      style="display: none;"
      class="absolute top-4 sm:top-6 z-30 flex items-center gap-2 bg-[#1b2622]/80 backdrop-blur-md px-4 py-2 rounded-full border border-white/10 text-xs text-[#e2b474] font-medium active:scale-95 shadow-md hover:bg-[#2a3b35]/80 transition-all cursor-pointer animate-pop-in duration-500"
    >
      <i data-lucide="smartphone" class="w-3.5 h-3.5 animate-bounce"></i>
      <span>تثبيت التطبيق على الشاشة الرئيسية 📱</span>
    </button>

    <!-- PERFECTLY SQUARE CARD CONTAINER (260x260px) centered exactly -->
    <div 
      id="birthday-gift-card"
      class="relative z-10 w-[260px] h-[260px] rounded-3xl p-4 flex flex-col justify-between items-center text-center glass-panel select-none overflow-hidden animate-pop-in"
    >
      
      <!-- Floating heart burst particles container -->
      <div id="particles-container" class="absolute inset-0 pointer-events-none overflow-hidden z-20"></div>

      <!-- STEP 1 CONTAINER -->
      <div id="view-step-1" class="flex flex-col justify-between items-center w-full h-full py-1">
        <span class="text-xs font-mono text-[#e2b474]/70 uppercase tracking-widest">Mylady 👑</span>

        <div class="flex-1 flex items-center justify-center px-1">
          <h2 class="text-[20px] font-bold text-white font-cairo leading-snug tracking-tight">
            <span id="typed-text-1" class="typewriter-cursor"></span>
          </h2>
        </div>
        <button
          id="btn-step-1"
          disabled
          class="w-full py-2 rounded-xl text-sm font-semibold font-cairo shadow-inner glass-button text-white flex items-center justify-center gap-1.5 cursor-pointer opacity-40 pointer-events-none"
        >
          <span>زينة</span>
          <i class="w-3.5 h-3.5 text-[#e2b474]" data-lucide="sparkles"></i>
        </button>
      </div>

      <!-- STEP 2 CONTAINER -->
      <div id="view-step-2" class="hidden flex flex-col justify-between items-center w-full h-full py-1">
        <span class="text-xs font-mono text-[#e2b474]/70 uppercase tracking-widest">Specials ✨</span>
        <div class="flex-1 flex items-center justify-center px-1">
          <h2 class="text-[19px] font-bold text-white font-cairo leading-snug tracking-tight">
            <span id="typed-text-2" class="typewriter-cursor"></span>
          </h2>
        </div>
        <button
          id="btn-step-2"
          disabled
          class="w-full py-2 rounded-xl text-sm font-semibold font-cairo glass-button text-white flex items-center justify-center gap-1.5 cursor-pointer opacity-40 pointer-events-none"
        >
          <span>ميلادي 🎂</span>
        </button>
      </div>

      <!-- STEP 3 CONTAINER (غدير تعرفين مفروض انطيج غزل على هل جمال؟) -->
      <div id="view-step-3" class="hidden flex flex-col justify-between items-center w-full h-full py-1">
        <span class="text-xs font-mono text-[#e2b474]/70 uppercase tracking-widest">Admiration 🤍</span>
        
        <!-- Elegant iOS Hand Kissing Illustration -->
        <div class="w-[110px] h-[95px] my-1 rounded-2xl overflow-hidden border border-[#e2b474]/25 shadow-md bg-black/30 flex-shrink-0">
          <img 
            src="/src/assets/images/knight_kiss_hand_1780739519288.png" 
            alt="Knight Kissing Hand" 
            class="w-full h-full object-cover"
            referrerPolicy="no-referrer"
          />
        </div>

        <div class="flex-1 flex items-center justify-center px-1">
          <h4 class="text-[13px] font-semibold text-white/95 font-cairo tracking-tight leading-snug">
            <span id="typed-text-3" class="typewriter-cursor"></span>
          </h4>
        </div>
        <button
          id="btn-step-3"
          disabled
          class="w-full py-1.5 rounded-xl text-xs font-semibold font-cairo glass-button text-white flex items-center justify-center gap-1.5 cursor-pointer opacity-40 pointer-events-none"
        >
          <span>كولي 🤍</span>
        </button>
      </div>

      <!-- STEP 4 CONTAINER (The poem screen) -->
      <div id="view-step-4" class="hidden flex flex-col justify-between items-center w-full h-full py-0.5">
        <span class="text-[10px] font-mono text-[#e2b474]/80 uppercase tracking-widest">شعر لغدير 🌸</span>
        
        <!-- Romantic Knight Shield Painting in landscape iOS block -->
        <div class="w-full h-[65px] my-1 rounded-2xl overflow-hidden border border-[#e2b474]/20 shadow-sm bg-black/30 flex-shrink-0">
          <img 
            src="/src/assets/images/knight_shield_princess_1780739532655.png" 
            alt="Knight Protecting Princess" 
            class="w-full h-full object-cover object-top"
            referrerPolicy="no-referrer"
          />
        </div>

        <div class="flex-1 flex flex-col justify-center items-center w-full my-0.5">
          <!-- Adjust poem font size so it fits neatly without overflow inside the 260x260 card -->
          <p id="typed-text-4" class="text-[10px] font-medium text-white/90 font-cairo leading-normal text-center select-none whitespace-pre-line tracking-tight px-0.5 max-h-[145px] overflow-hidden">
          </p>
        </div>
        <button
          id="btn-step-4-poem"
          disabled
          class="w-full py-1.5 rounded-xl text-xs font-semibold font-cairo bg-[#e2b474] text-black flex items-center justify-center gap-1 cursor-pointer opacity-40 pointer-events-none shadow-md"
        >
          <span>اني هم احبك🎀</span>
        </button>
      </div>

      <!-- STEP 5 CONTAINER (Favorite Song with Custom iOS Music Player) -->
      <div id="view-step-5" class="hidden flex flex-col justify-between items-center w-full h-full py-1 z-10">
        <span class="text-[10px] font-mono text-[#e2b474]/90 uppercase tracking-widest font-semibold">أغنيتنا المفضلة 🎵</span>
        
        <!-- Elegant iOS rounded frame in landscape shape for YouTube -->
        <div id="iframe-container-step-5" class="w-full h-[110px] rounded-2xl overflow-hidden border border-[#e2b474]/25 shadow-md bg-black/40 my-1">
        </div>

        <div class="text-center my-0.5 max-w-[210px] truncate">
          <h5 class="text-[11px] font-bold text-white font-cairo truncate">وين ذكرياتنا (يا غائباً)</h5>
          <p class="text-[9px] text-[#e2b474]/75 font-cairo font-medium truncate">عبدالله آل مخلص 🤍</p>
        </div>

        <a
          id="btn-step-5-link"
          href="https://youtu.be/3YxaaGgTQYM?si=LIYIsqHo6nRV6ZSR"
          target="_blank"
          rel="noopener noreferrer"
          class="w-full py-1.5 rounded-xl text-[10px] font-semibold font-cairo bg-gradient-to-r from-[#e2b474] to-[#cba063] hover:from-[#f3ca8f] hover:to-[#dfb578] text-black flex items-center justify-center gap-1 cursor-pointer shadow-lg active:scale-95 transition-all text-center select-none decoration-none no-underline"
        >
          <span>افتح في يوتيوب 🤍</span>
          <i class="w-3 h-3 text-black" data-lucide="music"></i>
        </a>
      </div>

      <!-- Real background audio iframe loaded inside the gift box when unlocked -->
      <iframe
        id="youtube-audio-bridge"
        class="absolute -left-[9999px] -top-[9999px] w-10 h-10"
        src="https://www.youtube.com/embed/3YxaaGgTQYM?enablejsapi=1&autoplay=0&mute=0&controls=1&rel=0&playsinline=1"
        allow="autoplay; encrypted-media"
        title="Favorite Song"
      ></iframe>

    </div>

    <!-- Humid copyright footer -->
    <footer class="absolute bottom-6 z-10 text-[10px] font-mono text-white/30 tracking-tight text-center pointer-events-none">
      <span>Ghadir’s Day 🤍 Crafted For Ghadir</span>
    </footer>

    <!-- Interactive script orchestration -->
    <script>
      // Initialize Lucide icons
      lucide.createIcons();

      // Dialog messages logic
      const textConfig = {
        1: "شلونج ملاكي؟",
        2: "اليوم تاريخ ميلاد منو؟",
        3: "غدير تعرفين مفروض انطيج غزل على هل جمال؟",
        4: "يَا مَنْ مَلَكْتِ الرُّوحَ وَالقَلْبُ بَيْتُكِ\nأَنْتِ الهَوَى المَكْتُوبُ وَأَنْتِ حَلَالِي\nنَسِيرُ فِي دَرْبِ الحَيَاةِ بِعِشْقِنَا\nوَحُبُّكِ الصَّافِي يُنِيرُ اليَالِي\nوَإِنْ بَغَيْتِ العُمْرَ كُلَّ العُمْرِ لَكِ\nيَا جَنَّةَ الدُّنْيَا وَأَغْلَى غَالِي"
      };

      let currentStep = 1;

      // Safe typewriter implementation
      function runTypewriter(stepIndex, callback) {
        const targetElement = document.getElementById(`typed-text-${stepIndex}`);
        if (!targetElement) return;

        const text = textConfig[stepIndex];
        targetElement.textContent = "";
        targetElement.classList.add("typewriter-cursor");

        let charIndex = 0;
        // Make the poetry typing extremely snappy and fluid so the user is not left waiting
        const speed = stepIndex === 4 ? 25 : 60;

        const interval = setInterval(() => {
          const char = text.charAt(charIndex);
          if (char === '\n') {
            targetElement.innerHTML += '<br/>';
          } else {
            targetElement.innerHTML += char;
          }
          charIndex++;
          if (charIndex >= text.length) {
            clearInterval(interval);
            targetElement.classList.remove("typewriter-cursor");
            if (callback) callback();
          }
        }, speed);
      }

      // Transition step screens gracefully
      function goToStep(nextStep) {
        const currentView = document.getElementById(`view-step-${currentStep}`);
        const nextView = document.getElementById(`view-step-${nextStep}`);

        if (currentView) currentView.classList.add("hidden");
        if (nextView) {
          nextView.classList.remove("hidden");
          nextView.classList.add("animate-pop-in");
        }

        currentStep = nextStep;

        if (nextStep <= 4) {
          runTypewriter(nextStep, () => {
            // Enable corresponding buttons once typing finishes
            const btn = document.getElementById(`btn-step-${nextStep}`) || document.getElementById("btn-step-4-poem");
            if (btn) {
              btn.removeAttribute("disabled");
              btn.classList.remove("opacity-40", "pointer-events-none");
            }
          });
        } else if (nextStep === 5) {
          // Teleport/move the preloaded iframe inside the visible Step 5 container
          const ytIframe = document.getElementById("youtube-audio-bridge");
          const container = document.getElementById("iframe-container-step-5");
          if (ytIframe && container) {
            // Remove absolute hidden styles
            ytIframe.classList.remove("absolute", "-left-[9999px]", "-top-[9999px]", "w-10", "h-10");
            // Add block responsive styling
            ytIframe.classList.add("w-full", "h-full", "block");
            // Append to Step 5 slot so it's fully interactable
            container.appendChild(ytIframe);
            
            // Send unMute and play commands
            try {
              if (ytIframe.contentWindow) {
                ytIframe.contentWindow.postMessage(
                  JSON.stringify({ event: 'command', func: 'unMute', args: '' }),
                  '*'
                );
                ytIframe.contentWindow.postMessage(
                  JSON.stringify({ event: 'command', func: 'playVideo', args: '' }),
                  '*'
                );
              }
            } catch (_) {}
          }
          return;
          const dummy = null;

          // Sync timer progress
          let playInterval = setInterval(() => {
            if (!isPlaying) return;
            playDuration++;
            let mins = Math.floor(playDuration / 60);
            let remSecs = playDuration % 60;
            if (timeEl) {
              timeEl.textContent = `${mins.toString().padStart(2, '0')}:${remSecs.toString().padStart(2, '0')}`;
            }
            
            let portion = Math.min(100, Math.floor((playDuration / 218) * 100)); // out of 3:38
            if (progressEl) {
              progressEl.style.width = `${portion}%`;
            }
          }, 1000);

          function sendPlayerCommand(cmd) {
            if (ytIframe && ytIframe.contentWindow) {
              try {
                ytIframe.contentWindow.postMessage(
                  JSON.stringify({ event: 'command', func: 'unMute', args: '' }),
                  '*'
                );
                ytIframe.contentWindow.postMessage(
                  JSON.stringify({ event: 'command', func: cmd, args: '' }),
                  '*'
                );
              } catch (_) {}
            }
          }

          // Force background auto-play
          setTimeout(() => {
            sendPlayerCommand("playVideo");
          }, 500);

          // Listen to clicks to play/pause
          if (playBtn) {
            playBtn.addEventListener("click", () => {
              isPlaying = !isPlaying;
              if (isPlaying) {
                sendPlayerCommand("playVideo");
                if (playIcon) playIcon.classList.add("hidden");
                if (pauseIcon) pauseIcon.classList.remove("hidden");
                if (albumCover) albumCover.classList.add("animate-spin");
              } else {
                sendPlayerCommand("pauseVideo");
                if (playIcon) playIcon.classList.remove("hidden");
                if (pauseIcon) pauseIcon.classList.add("hidden");
                if (albumCover) albumCover.classList.remove("animate-spin");
              }
            });
          }
        }
      }

      // Step 1 Button Click
      document.getElementById("btn-step-1").addEventListener("click", () => {
        goToStep(2);
      });

      // Step 2 Button Click
      document.getElementById("btn-step-2").addEventListener("click", () => {
        goToStep(3);
      });

      // Step 3 Button Click
      document.getElementById("btn-step-3").addEventListener("click", () => {
        goToStep(4);
      });

      // Step 4 Poem Button Click -> Proceed to the song player!
      document.getElementById("btn-step-4-poem").addEventListener("click", (e) => {
        // Synchronously send play command inside direct user click gesture to bypass autoplay rules
        const ytIframe = document.getElementById("youtube-audio-bridge");
        if (ytIframe && ytIframe.contentWindow) {
          try {
            ytIframe.contentWindow.postMessage(
              JSON.stringify({ event: 'command', func: 'unMute', args: '' }),
              '*'
            );
            ytIframe.contentWindow.postMessage(
              JSON.stringify({ event: 'command', func: 'playVideo', args: '' }),
              '*'
            );
          } catch (_) {}
        }

        // Trigger romantic floating heart burst on final choice to elevate emotion!
        const cardRect = document.getElementById("birthday-gift-card").getBoundingClientRect();
        const clickX = e.clientX - cardRect.left;
        const clickY = e.clientY - cardRect.top;
        const particlesContainer = document.getElementById("particles-container");

        // Synthesize nice beep tone
        try {
          const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
          if (AudioCtxClass) {
            const audioCtx = new AudioCtxClass();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.15); // C6 spark
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
          }
        } catch (_) {}

        // Custom hearts burst
        for (let i = 0; i < 18; i++) {
          const p = document.createElement("span");
          p.textContent = "❤";
          p.className = "absolute text-rose-500 pointer-events-none font-bold text-lg select-none animate-heart-particle";
          p.style.left = `${clickX || 130}px`;
          p.style.top = `${clickY || 130}px`;
          
          const angle = Math.random() * Math.PI * 2;
          const velocity = Math.random() * 85 + 40; 
          const dx = Math.cos(angle) * velocity;
          const dy = Math.sin(angle) * velocity - 40; 
          const rotation = Math.random() * 240 - 120;
          const scale = Math.random() * 0.8 + 0.5;
          const duration = Math.random() * 0.4 + 0.8;

          p.style.setProperty("--dx", `${dx}px`);
          p.style.setProperty("--dy", `${dy}px`);
          p.style.setProperty("--rot", `${rotation}deg`);
          p.style.setProperty("--scale", scale);
          p.style.setProperty("--dur", `${duration}s`);
          p.style.textShadow = "0 0 8px rgba(244,63,94,0.4)";

          particlesContainer.appendChild(p);
          setTimeout(() => p.remove(), duration * 1000);
        }

        goToStep(5);
      });

      // Initialize the flow
      window.addEventListener("DOMContentLoaded", () => {
        goToStep(1);
      });

      // PWA Install Prompt Handler
      let deferredPrompt;
      const pwaBanner = document.getElementById("pwa-banner");

      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        pwaBanner.style.display = "flex";
      });

      pwaBanner.addEventListener("click", async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === "accepted") {
          pwaBanner.style.display = "none";
        }
        deferredPrompt = null;
      });

      // Service Worker registration
      if ('serviceWorker' in navigator) {
        window.navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('SW Registered', reg.scope))
          .catch((err) => console.error('SW Failed', err));
      }
    </script>
